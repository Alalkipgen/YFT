name: Bootstrap production Gradle wrapper

on:
  push:
    branches:
      - "work/phase-1-foundation"
    paths:
      - ".github/workflows/bootstrap-gradle-wrapper.yml"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/wrapper/gradle-wrapper.properties"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate official wrapper files
        run: gradle --no-daemon wrapper --gradle-version 8.9 --distribution-type bin
      - name: Commit wrapper binary and executable bit
        shell: bash
        run: |
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Wrapper files already complete."
          else
            git commit -m "chore: complete production Gradle wrapper"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
