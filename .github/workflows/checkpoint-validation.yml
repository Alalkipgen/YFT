name: Work-branch checkpoint validation

on:
  # Documentation-only pushes (plans, prompts, status notes) start no Gradle run; a push that
  # also changes code, scripts, Gradle files or workflows still runs it. Run by hand with
  # workflow_dispatch when needed. A pull request's paths filter looks at the whole pull request
  # (every commit against main), so once its branch changes code every push to it starts this
  # workflow, documentation only or not: the job "scope" then looks at the pushed commits alone.
  push:
    branches:
      - "work/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    # A pull request's push (before...after): every changed file under docs/ or ending in .md (as
    # paths-ignore above) and the previous head's run of this workflow passed -> "validate" is
    # skipped (a skipped job counts as passed; the code is the passed run's). Any other file, a
    # force push, an opened or reopened pull request, a push to work/**, a manual run, a previous
    # run not passed or not finished, or a failed lookup -> "validate" runs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Do the pushed commits change more than documentation?
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REPO: ${{ github.repository }}
        run: |
          code=true
          if [[ "$EVENT" == pull_request && "$ACTION" == synchronize && -n "$BEFORE" && -n "$AFTER" ]] &&
            compare="$(gh api "repos/$REPO/compare/$BEFORE...$AFTER")" &&
            [[ "$(jq -r '.status' <<<"$compare")" == ahead ]] &&
            count="$(jq -r '.files | length' <<<"$compare")" && (( count > 0 && count < 300 )) &&
            files="$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<<"$compare")" &&
            runs="$(gh api "repos/$REPO/actions/workflows/checkpoint-validation.yml/runs?head_sha=$BEFORE&per_page=5")" &&
            [[ "$(jq -r '.workflow_runs[0] | "\(.status) \(.conclusion)"' <<<"$runs")" == "completed success" ]]; then
            code=false
            while IFS= read -r file; do
              if [[ "$file" != docs/* && "$file" != *.md ]]; then
                code=true
                break
              fi
            done <<<"$files"
          fi
          if [[ "$code" == false ]]; then
            echo "Documentation only since ${BEFORE:0:7}, whose run passed: the Gradle job is skipped."
          else
            echo "The Gradle job runs."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  validate:
    needs: scope
    if: needs.scope.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35, NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # A runner's download can fail (a network flake; 0cf7b61's routeb job): three tries.
          for try in 1 2 3; do
            if "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" \
              "ndk;27.3.13750724" "cmake;3.22.1"; then
              exit 0
            fi
            echo "sdkmanager: try $try of 3 failed" >&2
            sleep 20
          done
          exit 1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # v1.0.2 item 0: the runner's Gradle memory, from one place (scripts/ci-gradle-memory.sh).
      - name: CI Gradle memory
        shell: bash
        run: bash scripts/ci-gradle-memory.sh
      # The proof that the values reach the build: each Gradle and Kotlin daemon this job starts is
      # noted with its memory flags in the background, and the job's last step reports them.
      - name: Note the Gradle and Kotlin daemons' memory (background)
        shell: bash
        run: |
          nohup bash scripts/ci-gradle-memory.sh --watch "$RUNNER_TEMP/gradle-daemons.tsv" \
            >/dev/null 2>&1 </dev/null &
      - name: Validate production checkpoint
        shell: bash
        run: |
          if [[ -x ./gradlew ]]; then
            ./gradlew --no-daemon \
              lintDebug \
              testDebugUnitTest \
              :core-model:test \
              :extractor-api:test \
              :extractor-generic:test \
              :extractor-sites:test \
              :app:assembleDebug
          elif [[ -f spikes/phase0-media/settings.gradle.kts ]]; then
            gradle -p spikes/phase0-media --no-daemon lintDebug testDebugUnitTest assembleDebug
          else
            echo "No supported Gradle project was found." >&2
            exit 1
          fi
      # v1.0.2: the Master engine's and the scripts' tests run here too, each in its own step (they
      # ran only on the agents' machines before a checkpoint).
      - name: Master engine tests (extractor-master)
        shell: bash
        run: ./gradlew --no-daemon :extractor-master:test
      - name: Script tests (scripts/tests)
        shell: bash
        env:
          # The publish dry runs start Python with a temporary HOME: without the user's own
          # packages here too, a package those runs cannot import skips its tests in both.
          PYTHONNOUSERSITE: "1"
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build and check the unsigned release APK
        shell: bash
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          version="$(sed -n 's/^yft\.versionName=//p' gradle.properties | tail -n 1)"
          bash scripts/verify-release-apk.sh --allow-unsigned --expected-version "$version" \
            app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload debug APK for sideload testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yft-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore
      - name: The Gradle and Kotlin daemons' memory
        if: always()
        shell: bash
        run: bash scripts/ci-gradle-memory.sh --report "$RUNNER_TEMP/gradle-daemons.tsv"
