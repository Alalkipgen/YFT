name: Work-branch checkpoint validation

on:
  # Documentation-only pushes (plans, prompts, status notes) start no Gradle run; a push that
  # also changes code, scripts, Gradle files or workflows still runs it. Run by hand with
  # workflow_dispatch when needed.
  push:
    branches:
      - "work/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35, NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.3.13750724" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate production checkpoint
        shell: bash
        run: |
          if [[ -x ./gradlew ]]; then
            ./gradlew --no-daemon \
              lintDebug \
              testDebugUnitTest \
              :core-model:test \
              :extractor-api:test \
              :extractor-generic:test \
              :extractor-sites:test \
              :app:assembleDebug
          elif [[ -f spikes/phase0-media/settings.gradle.kts ]]; then
            gradle -p spikes/phase0-media --no-daemon lintDebug testDebugUnitTest assembleDebug
          else
            echo "No supported Gradle project was found." >&2
            exit 1
          fi
      - name: Build and check the unsigned release APK
        shell: bash
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          version="$(sed -n 's/^yft\.versionName=//p' gradle.properties | tail -n 1)"
          bash scripts/verify-release-apk.sh --allow-unsigned --expected-version "$version" \
            app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload debug APK for sideload testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yft-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore
