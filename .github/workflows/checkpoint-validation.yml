name: Work-branch checkpoint validation

on:
  push:
    branches:
      - "work/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate checkpoint
        shell: bash
        run: |
          if [[ -x ./gradlew ]]; then
            ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
          elif [[ -f spikes/phase0-media/settings.gradle.kts ]]; then
            gradle -p spikes/phase0-media --no-daemon lintDebug testDebugUnitTest assembleDebug
          else
            echo "No supported Gradle project was found." >&2
            exit 1
          fi
