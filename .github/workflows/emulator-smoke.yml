name: Android emulator smoke

on:
  push:
    branches: ["work/phase-*"]
    paths:
      - "app/**"
      - "core-*/**"
      - "extractor-*/**"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "scripts/ci-emulator-smoke.sh"
      - "scripts/ci-smoke-diagnostics.py"
      - "scripts/tests/test_ci_smoke_diagnostics.py"
      - ".github/workflows/emulator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install compile SDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          manager="$(find "$sdk" -path '*/bin/sdkmanager' -type f -print -quit)"
          test -n "$manager"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate diagnostics
        run: |
          bash -n scripts/ci-emulator-smoke.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s scripts/tests -p test_ci_smoke_diagnostics.py -v
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache AVD
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
          key: avd-google-apis-34-x86-64-v1
      - name: Generate AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: echo "Generated a clean AVD snapshot"
      - name: Save clean AVD before installing the test app
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/avd/*
          key: avd-google-apis-34-x86-64-v1
      - name: Run real WebView tests and collect diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio
            -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/ci-emulator-smoke.sh
      - name: Upload emulator screenshots, sanitized logcat and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yft-emulator-smoke
          path: |
            ${{ runner.temp }}/yft-smoke/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            !app/build/outputs/androidTest-results/connected/**/*.pb
            !app/build/outputs/androidTest-results/connected/**/*.bin
          retention-days: 14
          if-no-files-found: warn