name: Phase 0 validation

on:
  push:
    branches: [main]
    paths:
      - "spikes/phase0-media/**"
      - "scripts/ci-gradle-memory.sh"
      - ".github/workflows/phase0-validation.yml"
  pull_request:
    paths:
      - "spikes/phase0-media/**"
      - "scripts/ci-gradle-memory.sh"
      - ".github/workflows/phase0-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # v1.0.2 item 0: the runner's Gradle memory, from one place (scripts/ci-gradle-memory.sh).
      - name: CI Gradle memory
        shell: bash
        run: bash scripts/ci-gradle-memory.sh
      - name: Lint, unit tests and debug build
        run: gradle -p spikes/phase0-media --no-daemon lintDebug testDebugUnitTest assembleDebug
