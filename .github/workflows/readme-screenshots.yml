name: README screenshots

# README screenshots: the opt-in ReadmeScreenshotsTest takes the app pictures in the README on a
# Pixel 6-sized API 34 emulator (scripts/readme-screenshots.sh), and a push run commits the ones
# that changed to docs/screenshots/ on the same branch. It starts on a push to a work branch that
# changes the test, its script or this file. GitHub shows "Run workflow" only for workflows on the
# default branch. The commit uses the workflow's token, so it starts no other workflow.
on:
  push:
    branches: ["work/phase-*"]
    paths:
      - ".github/workflows/readme-screenshots.yml"
      - "scripts/readme-screenshots.sh"
      - "app/src/androidTest/java/com/alal/yft/smoke/ReadmeScreenshotsTest.kt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # The runner's Gradle memory, from one place (scripts/ci-gradle-memory.sh).
      - name: CI Gradle memory
        shell: bash
        run: bash scripts/ci-gradle-memory.sh
      - name: Install compile SDK, NDK and CMake
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          manager="$(find "$sdk" -path '*/bin/sdkmanager' -type f -print -quit)"
          test -n "$manager"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take the screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash scripts/readme-screenshots.sh
      - name: Upload the screenshots and the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yft-readme-screenshots
          path: |
            docs/screenshots/
            build/readme-screenshots-instrument.log
            build/readme-screenshots-logcat.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Commit changed screenshots
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "The screenshots did not change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update README screenshots"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
