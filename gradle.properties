org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m

# Release identity, read by app/build.gradle.kts and scripts/release-prep.sh.
# Raise yft.versionCode for every APK handed to users: Android refuses to install a lower one.
yft.versionCode=1
yft.versionName=1.0.0-beta.1
