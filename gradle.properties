org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m

# Release identity, read by app/build.gradle.kts and scripts/release-prep.sh.
# yft.versionCode follows the version code rule (docs/IN_APP_UPDATE_PLAN.md section 4.2), which
# the in-app update computes from a release's tag: a stable X.Y.Z is X*1000000 + Y*10000 + Z*100
# (Y, Z at most 99; 1.0.0 = 1000000, 1.0.1 = 1000100, 1.1.0 = 1010000); a prerelease takes a code
# just below its version's (1.0.0-rc.1 = 999901). Android refuses to install a lower code.
# VersionCodeRuleTest fails when the two disagree.
yft.versionCode=1000100
yft.versionName=1.0.1
