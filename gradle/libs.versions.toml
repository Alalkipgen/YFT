[versions]
agp = "8.7.3"
kotlin = "2.0.21"
androidx-core = "1.15.0"
activity-compose = "1.10.0"
lifecycle = "2.8.7"
navigation = "2.8.5"
compose-bom = "2024.12.01"
hilt = "2.52"
